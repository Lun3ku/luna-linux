# The Luna Linux lock screen.
# The field names were checked against the reference example from the hyprlock package.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrains Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/backgrounds/luna/luna.png
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    # $TIME12 is hyprlock's built-in 12-hour variable.
    # Plain $TIME gives the 24-hour format.
    text = $TIME12
    font_size = 96
    font_family = $font
    color = rgba(232, 228, 244, 0.95)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = rgba(154, 147, 179, 0.9)
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = rgba(180, 160, 255, 0.9)
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    rounding = 14
    inner_color = rgba(27, 25, 38, 0.85)
    outer_color = rgba(180, 160, 255, 0.9) rgba(139, 213, 255, 0.9) 45deg
    check_color = rgba(139, 213, 255, 0.9)
    fail_color  = rgba(255, 146, 168, 0.9)
    font_color  = rgba(232, 228, 244, 0.95)
    font_family = $font
    placeholder_text = Password
    fail_text = Wrong password
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -60
    halign = center
    valign = center
}

# The keyboard layout is shown on the lock screen - otherwise it is a mystery
# why the correct password is not being accepted.
label {
    monitor =
    text = $LAYOUT[EN,RU]
    font_size = 14
    font_family = $font
    color = rgba(154, 147, 179, 0.8)
    position = 0, -130
    halign = center
    valign = center
}
