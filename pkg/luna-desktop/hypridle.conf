# Idle behaviour. The format is hypr-lang, as in the reference example
# shipped with the package.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # pidof guards against a second hyprlock starting on top of the first.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Bring the picture back after waking, without waiting for a keypress.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 5 minutes: dim the screen. This is the warning before locking.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 minutes: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 minutes: turn the screen off.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspending after half an hour is deliberately NOT enabled: on a desktop
# machine it is annoying, on a laptop it is useful. Uncomment it if needed.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
