# Поведение при простое. Формат — hypr-lang, как в эталонном примере пакета.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # pidof защищает от запуска второго hyprlock поверх первого.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Вернуть картинку после пробуждения, не дожидаясь нажатия клавиши.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 5 минут — приглушить экран. Это предупреждение перед блокировкой.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 минут — заблокировать.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 минут — погасить экран.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Засыпать через полчаса — намеренно НЕ включено: на стационарной машине
# это раздражает, на ноутбуке полезно. Раскомментируй, если нужно.
