# Обои Luna Linux.
#
# ВАЖНО про формат. В hyprpaper 0.8 схема конфига изменилась: обои
# задаются секцией wallpaper, а ключа preload не существует вовсе —
# проверено бинарным поиском по программе и по исходнику ConfigManager.
# Старый вид
#     preload = /путь
#     wallpaper = ,/путь
# молча ничего не делает: в логе появляется только
#     Monitor <имя> has no target: no wp will be created
#
# Официальная вики на момент написания описывала ещё старый синтаксис,
# так что сверяться надо с исходником, а не с ней.

splash = 0
ipc = 1

wallpaper {
    # Пустой monitor означает «на всех экранах».
    monitor =
    path = /usr/share/backgrounds/luna/luna.png
    # cover — заполнить экран, обрезав лишнее по краям.
    fit_mode = cover
}
