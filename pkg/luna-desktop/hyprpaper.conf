# The Luna Linux wallpaper.
#
# IMPORTANT, about the format. In hyprpaper 0.8 the config schema changed:
# the wallpaper is set by a wallpaper section, and the preload key does not
# exist at all - verified by searching the binary and the ConfigManager
# source. The old form
#     preload = /path
#     wallpaper = ,/path
# silently does nothing; the only trace in the log is
#     Monitor <name> has no target: no wp will be created
#
# At the time of writing the official wiki still described the old syntax,
# so the source, not the wiki, is what to check against.

splash = 0
ipc = 1

wallpaper {
    # An empty monitor means "on every screen".
    monitor =
    path = /usr/share/backgrounds/luna/luna.png
    # cover fills the screen, cropping whatever sticks out.
    fit_mode = cover
}
