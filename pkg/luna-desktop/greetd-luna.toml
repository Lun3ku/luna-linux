# The Luna Linux login screen.
#
# This file is kept apart from /etc/greetd/config.toml, which belongs to the
# greetd package. A systemd drop-in hands greetd this path instead, so we
# neither overwrite somebody else's config nor collect .pacnew files on update.

[terminal]
vt = 1

[default_session]
# tuigreet was chosen to match the installer: the same text interface.
#
# --cmd is mandatory. Without it tuigreet takes the first session in the list,
# which is the plain hyprland.desktop that creates no systemd session, leaving
# the panel, the wallpaper and the notifications dead. luna-session always
# starts the uwsm variant. Choosing another session is still possible with F3.
#
# --remember and --remember-session bring back the last user and the last
# session, so logging in takes one keypress.
command = "tuigreet --remember --remember-session --asterisks --time --sessions /usr/share/wayland-sessions --cmd /usr/bin/luna-session --greeting Luna"
user = "greeter"
