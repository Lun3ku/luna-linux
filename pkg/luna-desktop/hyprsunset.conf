# Night mode: the screen goes warmer in the evening and back to normal in the
# morning, without anyone having to remember to switch it.
#
# hyprsunset works through the gamma table of the output rather than through a
# shader over the screen. The practical difference is that the warm tint is
# NOT captured in screenshots and screen recordings - a shader would tint them
# orange as well.
#
# The file is read at ~/.config/hypr/hyprsunset.conf. It is the user's copy
# from /etc/skel, so editing it here is safe: a package update will not
# overwrite it.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

# A profile takes effect at its time and stays until the next one. On start
# hyprsunset applies whichever profile is current, so turning the machine on at
# midnight already gets the warm screen.

profile {
    # Daytime: identity means "change nothing at all". The temperature line is
    # ignored while identity is set, which is exactly what is wanted here.
    time = 7:00
    identity = true
}

profile {
    # Evening. 4000K is noticeably warmer than the 6500K of a normal screen but
    # still far from the orange that makes photographs unusable.
    time = 21:00
    temperature = 4000
}

# gamma is deliberately left alone. It lowers the perceived brightness below
# what the monitor itself allows, which is useful on a desktop screen that is
# still too bright at its minimum - but it also costs colour accuracy, and on a
# laptop the backlight already goes low enough through brightnessctl.
