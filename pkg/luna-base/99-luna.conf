# Tuned for zram: swap in compressed memory is cheap, so it can and should be
# used aggressively. With disk-backed swap these values would be harmful.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# The default file watch limit is hit on the first sizeable project: build
# tools and editors start silently losing changes.
fs.inotify.max_user_watches = 524288
