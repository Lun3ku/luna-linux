# Под zram: своп в сжатой памяти стоит дёшево, поэтому им можно и нужно
# пользоваться активно. С дисковым свопом такие значения были бы вредны.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Дефолтный лимит слежения за файлами упирается в потолок на первом же
# крупном проекте: сборщики и редакторы начинают молча терять изменения.
fs.inotify.max_user_watches = 524288
