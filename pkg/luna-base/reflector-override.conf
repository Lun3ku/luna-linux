# Our own set of arguments instead of @/etc/xdg/reflector/reflector.conf.
# That file belongs to the reflector package and is marked as backup;
# overwriting somebody else's config from our package would be wrong, so we
# override the command instead.
[Service]
ExecStart=
ExecStart=/usr/bin/reflector --protocol https --latest 20 --sort rate --save /etc/pacman.d/mirrorlist
