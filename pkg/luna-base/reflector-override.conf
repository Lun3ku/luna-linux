# Свой набор аргументов вместо @/etc/xdg/reflector/reflector.conf.
# Тот файл принадлежит пакету reflector и помечен как backup — переписывать
# чужой конфиг из нашего пакета неправильно, поэтому переопределяем команду.
[Service]
ExecStart=
ExecStart=/usr/bin/reflector --protocol https --latest 20 --sort rate --save /etc/pacman.d/mirrorlist
