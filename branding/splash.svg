<?xml version="1.0" encoding="UTF-8"?>
<!--
  Заставка загрузочного меню Luna Linux.

  Исходник намеренно SVG, а не PNG: правится текстом, версионируется
  осмысленно, и из него же собираются другие размеры. PNG генерируется
  скриптом scripts/make-branding.sh через rsvg-convert.

  Композиция повторяет логику арчевой заставки, которую мы заменяем:
  знак сверху, низ оставлен пустым под пункты меню, которые syslinux
  рисует поверх картинки.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0b0a12"/>
      <stop offset="1"   stop-color="#1c1a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#b4a0ff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#b4a0ff" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#b4a0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#sky)"/>

  <!-- Свечение вокруг луны -->
  <circle cx="126" cy="96" r="120" fill="url(#glow)"/>
  <!-- Сама луна -->
  <circle cx="126" cy="96" r="34" fill="#f2eeff"/>

  <!-- Звёзды. Гаснут рядом с луной, как и на обоях. -->
  <g fill="#e8e4f4">
    <circle cx="330" cy="52"  r="1.4" opacity="0.75"/>
    <circle cx="430" cy="118" r="1.1" opacity="0.55"/>
    <circle cx="528" cy="70"  r="1.6" opacity="0.8"/>
    <circle cx="592" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="368" cy="176" r="1.0" opacity="0.4"/>
    <circle cx="486" cy="208" r="1.3" opacity="0.6"/>
    <circle cx="288" cy="120" r="1.0" opacity="0.35"/>
    <circle cx="612" cy="36"  r="1.1" opacity="0.5"/>
  </g>

  <text x="196" y="88" font-family="JetBrainsMono Nerd Font, monospace"
        font-size="52" font-weight="bold" letter-spacing="6" fill="#e8e4f4">LUNA</text>
  <text x="200" y="124" font-family="JetBrainsMono Nerd Font, monospace"
        font-size="20" letter-spacing="10" fill="#b4a0ff">LINUX</text>
</svg>
